<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMP 3512 Assignment 2</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>COMP 3512 Assignment 2</h1>
    </header>

    <nav>
        <!--Home button-->
        <button id="home_button">HOME</button>

        <!--Browse button-->
        <button id="browse_button">BROWSE</button>

        <!--Cart button-->
        <button id="cart_button">CART</button>

        <!--About button-->
        <button id="about_button">ABOUT</button>
        
    </nav>

    <main>
    
        <article id="home_view" class="hidden"> <!--View #1-->
            <h2>Home</h2>
            <p>blah blah blah</p>
        </article>

        <article id="browse_view" class="hidden"> <!--View #2-->
            <h2>Browse</h2>

                <section id="filters">

                    <label for="name_filter">
                        Name
                    </label>

                    <input type="text" id="name_filter" placeholder="Search">

                    <label for="category_filter">
                        Category
                    </label>

                    <label for="rating_filter">
                        Rating
                    </label>

                    <label for="price filter">
                        Price
                    </label>
                    
                </section>

                <section id="product-container"></section>
        </article>

        <article id="product_view" class="hidden"> <!--View #3-->
            <h2>Single Product</h2>

            <section id="single_product_container"></section>

        </article>

        <article id="cart_view" class="hidden"> <!--View #4-->
            <h2>Cart</h2>

            <section id="cart_container"></section>

            <section id="cart_summary">
                <p id="cart_count">Items: 0</p> 

                <p id="merchandise_total">Merchandise: $0.00</p>

                <p id="shipping_total">Shipping: $0.00</p>

                <p id="tax_total">Tax: $0.00</p>

                <p id="cart_total">Total: $0.00</p>
            </section>

            <button id="checkout_button">
                Checkout
            </button>

            <section id="shipping_section">
                <h3>Shipping</h3>

                <select id="shipping_method">
                    <option value="standard">Standard</option>
                    <option value="express">Express</option>
                    <option value="priority">Priority</option>
                </select>

                <select id="shipping_destination">
                    <option value="canada">Canada</option>
                    <option value="usa">USA</option>
                    <option value="international">International</option>
                </select>
            </section>

        </article>

        <dialog id="about_popup"> <!--View #5-->
            <h2>About this page</h2>
            <section>
                <h3>Stuff</h3>
                <p>more stuff</p>
            </section>

            <button id="close_about">
                Close
            </button>

        </dialog>


    </main>
    
    <footer>COMP 3512 Assignment 2</footer>

    <script type="module" src="script.js"></script>

</body>
</html>
